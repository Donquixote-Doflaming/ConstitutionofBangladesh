<!DOCTYPE html>
<html lang="bn" data-theme="soft">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
<title>বাংলাদেশের সংবিধান</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;700;800&family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&family=Share+Tech+Mono&family=Teko:wght@600;700&display=swap" rel="stylesheet">
<style>
:root {
  --cp-yellow: #fcee0a;
  --cp-yellow-glow: rgba(252, 238, 10, 0.4);
  --cp-black: #181816;
  --cp-dark-panel: #1e1e1b;
  --cp-card-bg: #1e1e1b;
  --cp-cyan: #00f0ff;
  --cp-red: #ff003c;
  --cp-green: #00ff66;
  --cp-text: #ffffff;
  --cp-muted: #7e8b9b;
  --font-logo: 'Orbitron', sans-serif;
  --font-heading: 'Teko', sans-serif;
  --font-subhead: 'Rajdhani', sans-serif;
  --font-mono: 'Share Tech Mono', monospace;
  --font-bn: 'Noto Sans Bengali', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { background-color: var(--cp-black); -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--cp-black);
  color: var(--cp-text);
  font-family: var(--font-bn);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
  background-image: 
    radial-gradient(circle at 80% 20%, rgba(252, 238, 10, 0.08) 0%, transparent 40%),
    linear-gradient(rgba(252, 238, 10, 0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(252, 238, 10, 0.03) 1px, transparent 1px);
  background-size: 100% 100%, 24px 24px, 24px 24px;
  padding-bottom: env(safe-area-inset-bottom, 20px);
}

.bn { font-family: var(--font-bn); }
.mono { font-family: var(--font-mono); }

/* Navigation Bar */
.cp-navbar {
  background: #181816;
  border-bottom: 2px solid var(--cp-yellow);
  padding: 12px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}

.cp-logo-group {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
}

.cp-logo {
  font-family: var(--font-logo);
  font-size: clamp(1.1rem, 3.5vw, 1.4rem);
  font-weight: 900;
  color: var(--cp-yellow);
  letter-spacing: -1px;
  text-transform: uppercase;
  font-style: italic;
  text-shadow: 2px 2px 0px #00f0ff;
  line-height: 1;
}

.cp-logo span {
  color: #fff;
  font-size: 0.72rem;
  font-style: normal;
  display: block;
  font-family: var(--font-bn);
  letter-spacing: 0.5px;
  margin-top: 2px;
}

.cp-nav-links {
  display: flex;
  gap: 12px;
  align-items: center;
}

.cp-nav-btn {
  font-family: var(--font-mono);
  font-size: 0.85rem;
  font-weight: bold;
  color: var(--cp-text);
  background: transparent;
  padding: 8px 14px;
  border: 1px solid transparent;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  text-transform: uppercase;
  transition: all 0.15s ease;
  min-height: 40px;
}

.cp-nav-btn:hover, .cp-nav-btn.active {
  background: var(--cp-yellow);
  color: var(--cp-black);
  border-color: var(--cp-yellow);
}

.cp-buy-btn {
  background: var(--cp-yellow);
  color: var(--cp-black);
  font-family: var(--font-subhead);
  font-weight: 800;
  font-size: 0.95rem;
  padding: 8px 18px;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  text-transform: uppercase;
  letter-spacing: 1px;
  border: none;
  box-shadow: 0 0 10px var(--cp-yellow-glow);
  min-height: 40px;
}

.cp-buy-btn:hover {
  background: #fff;
  color: var(--cp-black);
}

.mobile-toggle {
  display: none;
  background: var(--cp-yellow);
  color: var(--cp-black);
  border: none;
  font-family: var(--font-mono);
  font-weight: bold;
  padding: 8px 12px;
  font-size: 1.1rem;
  cursor: pointer;
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
}

@media (max-width: 768px) {
  .mobile-toggle { display: block; }
  .cp-nav-links {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: #181816;
    border-bottom: 2px solid var(--cp-yellow);
    flex-direction: column;
    padding: 16px;
    align-items: stretch;
  }
  .cp-nav-links.open { display: flex; }
}

main {
  max-width: 1100px;
  margin: 0 auto;
  padding: 20px 16px 60px;
  position: relative;
  z-index: 2;
}

/* Official Yellow Hero Banner */
.cp-hero-banner {
  background: var(--cp-yellow);
  color: var(--cp-black);
  padding: clamp(20px, 4vw, 32px) clamp(16px, 4vw, 30px);
  margin-bottom: 24px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%);
  position: relative;
  border-bottom: 4px solid var(--cp-black);
  overflow: hidden;
}

.cp-hero-banner::before {
  content: "CONSTITUTION";
  position: absolute;
  right: -20px;
  bottom: -20px;
  font-family: var(--font-heading);
  font-size: clamp(4.5rem, 14vw, 10rem);
  color: rgba(0,0,0,0.06);
  font-weight: bold;
  pointer-events: none;
  line-height: 0.8;
  white-space: nowrap;
}

.cp-laurels {
  display: flex;
  gap: 20px;
  margin-bottom: 12px;
  font-family: var(--font-mono);
  font-size: clamp(0.65rem, 1.8vw, 0.75rem);
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: #1a1a00;
  flex-wrap: wrap;
}

.cp-laurel-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  position: relative;
  padding: 0 10px;
}

.cp-laurel-item::before, .cp-laurel-item::after {
  content: "❯";
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  color: var(--cp-black);
}
.cp-laurel-item::before { left: -4px; transform: translateY(-50%) rotate(180deg); }
.cp-laurel-item::after { right: -4px; }

.glitch-title {
  font-family: var(--font-bn);
  font-size: clamp(1.9rem, 5.5vw, 3.4rem);
  font-weight: 800;
  line-height: 1.1;
  color: var(--cp-black);
  max-width: 800px;
  margin-bottom: 14px;
}

.sub-header {
  font-family: var(--font-mono);
  font-size: clamp(0.7rem, 2vw, 0.85rem);
  font-weight: bold;
  letter-spacing: 1px;
  text-transform: uppercase;
  background: var(--cp-black);
  color: var(--cp-yellow);
  display: inline-block;
  padding: 5px 12px;
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  max-width: 100%;
  word-break: break-word;
}

/* Cyberpunk Buttons */
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; outline: none; }

.cyber-btn {
  font-family: var(--font-subhead);
  font-size: clamp(0.95rem, 2vw, 1.1rem);
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 12px 20px;
  background: var(--cp-yellow);
  color: var(--cp-black);
  border: 2px solid var(--cp-black);
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  position: relative;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  touch-action: manipulation;
}

.cyber-btn:hover {
  background: var(--cp-black);
  color: var(--cp-yellow);
  border-color: var(--cp-yellow);
  box-shadow: 0 0 15px var(--cp-yellow-glow);
}

.cyber-btn.outline {
  background: transparent;
  color: var(--cp-yellow);
  border-color: var(--cp-yellow);
}
.cyber-btn.outline:hover {
  background: var(--cp-yellow);
  color: var(--cp-black);
}

.cyber-btn.red {
  background: var(--cp-red);
  color: #fff;
  border-color: #fff;
}
.cyber-btn.red:hover {
  background: var(--cp-black);
  color: var(--cp-red);
  border-color: var(--cp-red);
  box-shadow: 0 0 15px rgba(255, 0, 60, 0.5);
}

.cyber-btn.cyan {
  background: var(--cp-cyan);
  color: var(--cp-black);
  border-color: var(--cp-cyan);
}
.cyber-btn.cyan:hover {
  background: var(--cp-black);
  color: var(--cp-cyan);
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.5);
}

/* Grid Card Layout */
.tech-tag {
  font-family: var(--font-mono);
  font-size: clamp(0.7rem, 2vw, 0.8rem);
  color: var(--cp-cyan);
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.tech-tag::before {
  content: "";
  display: inline-block;
  width: 8px; height: 8px;
  background: var(--cp-cyan);
}

.group-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}

.grid-card {
  background: var(--cp-dark-panel);
  border: 2px solid #22252e;
  border-top: 4px solid var(--cp-yellow);
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
  padding: 18px;
  text-align: left;
  cursor: pointer;
  position: relative;
  transition: all 0.15s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 135px;
  touch-action: manipulation;
}

.grid-card:hover {
  border-color: var(--cp-yellow);
  background: var(--cp-yellow);
  transform: translateY(-3px);
  box-shadow: 0 6px 20px var(--cp-yellow-glow);
}

.grid-card:hover b { color: var(--cp-black); }
.grid-card:hover span, .grid-card:hover .sub-desc { color: #1a1a1a; }
.grid-card:hover .item-code { color: rgba(0,0,0,0.65); }

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 10px;
}

.item-code {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--cp-cyan);
  letter-spacing: 1px;
}

.grid-card b {
  font-family: var(--font-bn);
  font-size: 1.25rem;
  font-weight: 700;
  color: #fff;
  line-height: 1.3;
  display: block;
  margin-bottom: 4px;
}

.grid-card .sub-desc {
  font-family: var(--font-bn);
  font-size: 0.85rem;
  color: var(--cp-muted);
}

.grid-card span {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--cp-muted);
  text-transform: uppercase;
  font-weight: bold;
}

.grid-card .pg-wrap {
  width: 100%;
  height: 4px;
  background: #111;
  margin-top: 12px;
  position: relative;
}

.grid-card .pg {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: var(--cp-cyan);
  box-shadow: 0 0 8px var(--cp-cyan);
}

/* Nav & Top Controls */
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.top-title {
  font-family: var(--font-bn);
  font-size: clamp(1.4rem, 4vw, 2rem);
  font-weight: 800;
  color: var(--cp-yellow);
  line-height: 1.2;
  text-shadow: 0 0 10px var(--cp-yellow-glow);
}

.tabs {
  display: flex;
  background: #181816;
  border: 2px solid var(--cp-yellow);
  padding: 2px;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
}

.tabs button {
  font-family: var(--font-mono);
  font-size: clamp(0.75rem, 2vw, 0.85rem);
  font-weight: bold;
  text-transform: uppercase;
  padding: 8px 14px;
  color: var(--cp-muted);
  transition: all 0.15s ease;
  min-height: 38px;
}

.tabs button[aria-selected="true"] {
  background: var(--cp-yellow);
  color: var(--cp-black);
}

/* Stats & Progress Bar */
.stat-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-mono);
  font-size: clamp(0.75rem, 2vw, 0.85rem);
  font-weight: bold;
  color: var(--cp-yellow);
  margin-bottom: 10px;
  gap: 10px;
}

.bar-container {
  height: 8px;
  background: #111;
  border: 1px solid var(--cp-yellow);
  margin-bottom: 20px;
  position: relative;
}

.bar-container i {
  display: block;
  height: 100%;
  background: var(--cp-yellow);
  box-shadow: 0 0 10px var(--cp-yellow);
  transition: width 0.3s ease;
}

/* Flashcard Scene */
.scene {
  perspective: 1200px;
  height: clamp(390px, 60vh, 500px);
  cursor: pointer;
  margin-bottom: 20px;
  touch-action: pan-y;
}

.card {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
  transform-style: preserve-3d;
}

.card.fl { transform: rotateY(180deg); }

.face {
  position: absolute;
  inset: 0;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  background: var(--cp-card-bg);
  border: 3px solid var(--cp-yellow);
  clip-path: polygon(20px 0, 100% 0, 100% calc(100% - 20px), calc(100% - 20px) 100%, 0 100%, 0 20px);
  padding: clamp(20px, 4vw, 36px);
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
}

.face.front {
  align-items: center;
  justify-content: center;
  text-align: center;
  background: #08080a;
}

.face.back-f {
  transform: rotateY(180deg);
  border-color: var(--cp-cyan);
  text-align: left;
  align-items: flex-start;
  justify-content: flex-start;
  gap: 14px;
  background: #08080a;
}

.card-badge {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--cp-cyan);
  border: 1px solid var(--cp-cyan);
  padding: 3px 10px;
  margin-bottom: 16px;
  letter-spacing: 1px;
}

.term-bn {
  font-family: var(--font-bn);
  font-size: clamp(1.35rem, 3.8vw, 2.1rem);
  font-weight: 700;
  color: var(--cp-yellow);
  line-height: 1.45;
  max-width: 820px;
  text-shadow: 0 0 12px rgba(252, 238, 10, 0.25);
}

.hint {
  font-family: var(--font-mono);
  font-size: clamp(0.75rem, 2vw, 0.85rem);
  color: var(--cp-black);
  background: var(--cp-yellow);
  border: 1px solid var(--cp-yellow);
  padding: 5px 16px;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin-top: 26px;
  font-weight: bold;
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
}

.back-header {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  width: 100%;
  border-bottom: 1px solid #1f2430;
  padding-bottom: 10px;
}

.chip {
  display: inline-block;
  padding: 4px 10px;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  text-transform: uppercase;
  font-weight: bold;
}

.chip.cyan { background: var(--cp-cyan); color: var(--cp-black); }
.chip.yellow { background: var(--cp-yellow); color: var(--cp-black); }

.ans-body {
  font-family: var(--font-bn);
  font-size: clamp(1.05rem, 2.5vw, 1.25rem);
  line-height: 1.65;
  color: #f2f4f8;
  width: 100%;
}

.ans-body ul {
  padding-left: 20px;
  margin-top: 6px;
}

.ans-body li {
  margin-bottom: 8px;
}

.ans-body strong {
  color: var(--cp-yellow);
}

.ans-body em {
  color: var(--cp-cyan);
  font-style: normal;
  font-weight: 600;
}

.row-note {
  width: 100%;
  font-size: 0.95rem;
  padding-top: 10px;
  margin-top: auto;
  border-top: 1px dashed #252b38;
  color: var(--cp-muted);
}

.row-note small {
  font-family: var(--font-mono);
  color: var(--cp-cyan);
  text-transform: uppercase;
  margin-right: 6px;
}

/* Actions Grid */
.act {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 480px) {
  .act { grid-template-columns: 1fr; }
}

/* Cyber Box Panels */
.cyber-box {
  background: var(--cp-dark-panel);
  border: 2px solid var(--cp-yellow);
  clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%, 0 16px);
  padding: clamp(18px, 4vw, 32px);
  text-align: center;
  box-shadow: 0 0 20px rgba(0,0,0,0.9);
}

.cyber-box h2 {
  font-family: var(--font-heading);
  color: var(--cp-yellow);
  font-size: clamp(2rem, 6vw, 2.8rem);
  text-transform: uppercase;
  line-height: 1;
  margin-bottom: 10px;
}

select {
  font-family: var(--font-bn);
  background: #181816;
  color: var(--cp-yellow);
  border: 2px solid var(--cp-yellow);
  padding: 12px;
  margin: 14px 0 20px;
  width: 100%;
  max-width: 420px;
  outline: none;
  font-size: 1rem;
  font-weight: bold;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
}

/* Options */
.q {
  font-family: var(--font-mono);
  font-size: clamp(0.8rem, 2vw, 0.95rem);
  color: var(--cp-cyan);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 8px;
}

.qw {
  font-family: var(--font-bn);
  font-size: clamp(1.2rem, 3.5vw, 1.65rem);
  font-weight: 700;
  color: var(--cp-yellow);
  line-height: 1.45;
  margin-bottom: 20px;
}

.opt {
  display: block;
  width: 100%;
  text-align: left;
  background: #1e1e1b;
  border: 2px solid #232836;
  padding: 14px 18px;
  margin-bottom: 10px;
  cursor: pointer;
  color: #fff;
  font-family: var(--font-bn);
  font-size: clamp(0.95rem, 2.5vw, 1.1rem);
  line-height: 1.45;
  transition: all 0.15s ease;
  clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
}

.opt:hover:not([disabled]) {
  border-color: var(--cp-yellow);
  background: var(--cp-yellow);
  color: var(--cp-black);
}

.opt.good {
  border-color: var(--cp-yellow) !important;
  background: var(--cp-yellow) !important;
  color: var(--cp-black) !important;
  font-weight: bold;
}

.opt.bad {
  border-color: var(--cp-red) !important;
  background: var(--cp-red) !important;
  color: #fff !important;
}

.miss {
  text-align: left;
  margin: 16px 0;
  padding: 0;
  list-style: none;
}

.miss li {
  padding: 12px 0;
  border-bottom: 1px solid #1c212d;
  font-size: 1rem;
  line-height: 1.5;
}

.miss li b {
  color: var(--cp-yellow);
  font-family: var(--font-bn);
  font-size: 1.05rem;
}

.kbd-hints {
  display: flex;
  justify-content: center;
  gap: 16px;
  margin-top: 16px;
  font-family: var(--font-mono);
  font-size: 0.8rem;
  color: var(--cp-muted);
  flex-wrap: wrap;
}

.kbd {
  border: 1px solid var(--cp-yellow);
  padding: 2px 6px;
  color: var(--cp-yellow);
  background: #181816;
  font-weight: bold;
}

/* Serial Articles Explorer Styles */
.art-controls {
  display: flex;
  gap: 12px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}

.art-search {
  flex: 1;
  min-width: 220px;
  background: #181816;
  border: 2px solid var(--cp-cyan);
  color: #fff;
  padding: 12px 16px;
  font-family: var(--font-bn);
  font-size: 1rem;
  outline: none;
  clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
}

.art-search:focus {
  border-color: var(--cp-yellow);
  box-shadow: 0 0 12px var(--cp-yellow-glow);
}

.part-filter {
  margin: 0 !important;
  max-width: 300px !important;
  border-color: var(--cp-cyan) !important;
  color: var(--cp-cyan) !important;
}

.part-section {
  margin-bottom: 24px;
  background: var(--cp-dark-panel);
  border: 1px solid #222632;
  border-left: 4px solid var(--cp-yellow);
  padding: 16px;
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%);
}

.part-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  border-bottom: 1px solid #232836;
  padding-bottom: 10px;
  margin-bottom: 14px;
}

.part-title {
  font-family: var(--font-bn);
  font-size: 1.25rem;
  font-weight: 800;
  color: var(--cp-yellow);
}

.part-range {
  font-family: var(--font-mono);
  font-size: 0.8rem;
  background: rgba(0, 240, 255, 0.12);
  color: var(--cp-cyan);
  border: 1px solid var(--cp-cyan);
  padding: 2px 10px;
}

.art-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
  gap: 10px;
}

.art-item {
  background: #181816;
  border: 1px solid #1e222d;
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  transition: all 0.15s ease;
  cursor: pointer;
  clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
}

.art-item:hover {
  border-color: var(--cp-yellow);
  background: #131620;
  transform: translateY(-2px);
}

.art-item.expanded {
  border-color: var(--cp-cyan);
  background: #0f131d;
  box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
}

.art-item.sub-art {
  border-left: 3px solid var(--cp-cyan);
}

.art-item.repealed {
  border-left: 3px solid var(--cp-red);
  opacity: 0.85;
}

.art-row-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.art-title-wrap {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.art-toggle-icon {
  font-family: var(--font-mono);
  font-size: 0.75rem;
  color: var(--cp-cyan);
  border: 1px solid rgba(0, 240, 255, 0.4);
  padding: 2px 6px;
  flex-shrink: 0;
}

.art-detail {
  font-family: var(--font-bn);
  font-size: 0.92rem;
  line-height: 1.6;
  color: #cfd6e3;
  padding-top: 8px;
  border-top: 1px dashed #262d3d;
  display: none;
}

.art-item.expanded .art-detail,
.art-list.show-all .art-detail {
  display: block;
}

.art-num {
  font-family: var(--font-bn);
  font-weight: 800;
  font-size: 0.95rem;
  background: var(--cp-yellow);
  color: var(--cp-black);
  padding: 2px 8px;
  min-width: 42px;
  text-align: center;
  flex-shrink: 0;
  clip-path: polygon(4px 0, 100% 0, 100% calc(100% - 4px), calc(100% - 4px) 100%, 0 100%, 0 4px);
}

.art-item.repealed .art-num {
  background: var(--cp-red);
  color: #fff;
}

.art-name {
  font-family: var(--font-bn);
  font-size: 1rem;
  font-weight: 600;
  color: #fff;
  line-height: 1.4;
}

/* ===== Theme options (palette: #1B1B2A #FF007A #00FFB3 #A700FF #FFEA00) ===== */
.theme-bar{max-width:1100px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;justify-content:flex-end;gap:10px;position:relative;z-index:3;font-family:var(--font-mono);font-size:.75rem;letter-spacing:1px;color:var(--cp-muted);text-transform:uppercase}
html[data-theme]{
  --cp-black:#1B1B2A; --cp-dark-panel:#222236; --cp-card-bg:#2a2a42;
  --cp-text:#ffffff; --cp-muted:#a3a3bd;
  --tint-bg:#171724; --tint-bg-hover:#2a2a42; --tint-bg-open:#26263c; --tint-line:#33334d;
}
html[data-theme] body{
  background-image:radial-gradient(circle at 80% 20%,color-mix(in srgb,var(--cp-yellow) 12%,transparent) 0%,transparent 40%),
    linear-gradient(color-mix(in srgb,var(--cp-yellow) 5%,transparent) 1px,transparent 1px),
    linear-gradient(90deg,color-mix(in srgb,var(--cp-yellow) 5%,transparent) 1px,transparent 1px)}
html[data-theme] .art-search{background:var(--tint-bg);color:#fff}
html[data-theme] .part-section{border-color:var(--tint-line);border-left-color:var(--cp-yellow)}
html[data-theme] .part-header{border-bottom-color:var(--tint-line)}
html[data-theme] .part-range{background:color-mix(in srgb,var(--cp-cyan) 14%,transparent)}
html[data-theme] .art-item{background:var(--tint-bg);border-color:var(--tint-line)}
html[data-theme] .art-item:hover{background:var(--tint-bg-hover)}
html[data-theme] .art-item.expanded{background:var(--tint-bg-open);box-shadow:0 0 15px color-mix(in srgb,var(--cp-cyan) 25%,transparent)}
html[data-theme] .art-toggle-icon{border-color:color-mix(in srgb,var(--cp-cyan) 45%,transparent)}
html[data-theme] .art-detail{border-top-color:var(--tint-line);color:#d9d9ea}
html[data-theme] .art-num,html[data-theme] .cyber-btn{color:var(--on-primary)}
html[data-theme] .cyber-btn.cyan{color:var(--cp-black)}
html[data-theme] .art-item.repealed .art-num{color:var(--cp-black)}
html[data-theme] .cyber-btn:hover{color:var(--cp-yellow)}

.art-detail .art-intro{margin:0 0 6px}
.art-detail ul.art-pts{margin:6px 0 2px;padding-left:0;list-style:none}
.art-detail ul.art-pts li{position:relative;padding:5px 0 5px 22px;line-height:1.7}
.art-detail ul.art-pts li::before{content:"";position:absolute;left:4px;top:.95em;width:7px;height:7px;background:var(--cp-yellow);transform:rotate(45deg)}
.art-detail ul.art-pts ul.art-pts{margin:4px 0 2px 4px;border-left:1px dashed var(--cp-cyan)}
.art-detail ul.art-pts ul.art-pts li::before{background:var(--cp-cyan);width:5px;height:5px;border-radius:50%;transform:none}

/* ===== Soft Study theme: warm paper, sage green, soft blue, amber ===== */
html[data-theme="soft"]{
  --cp-black:#F4EFE4; --cp-dark-panel:#FBF8F1; --cp-card-bg:#FFFFFF;
  --cp-text:#34404F; --cp-muted:#6B7685;
  --cp-yellow:#3F7A67; --cp-yellow-glow:transparent;
  --cp-cyan:#4F78A8; --cp-red:#B5655F; --cp-green:#3F7A67; --on-primary:#FFFFFF;
  --tint-bg:#FFFFFF; --tint-bg-hover:#F3F7F4; --tint-bg-open:#F6FAF7; --tint-line:#DDD5C4;
}
html[data-theme="soft"] body{background:#F4EFE4;background-image:none;color:#34404F}
html[data-theme="soft"] .theme-bar{color:#6B7685}
html[data-theme="soft"] html[data-theme="soft"] html[data-theme="soft"] .top-title{color:#2F5F50;text-shadow:none}
html[data-theme="soft"] .sub-header{background:#E4EEE8;color:#2F5F50;clip-path:none;border-radius:999px;padding:5px 14px}
html[data-theme="soft"] .art-search{background:#FFFFFF;color:#34404F;border:2px solid #C9D6CF;border-radius:12px;clip-path:none;font-size:1.02rem}
html[data-theme="soft"] .art-search:focus{border-color:#3F7A67}
html[data-theme="soft"] .part-filter{background:#FFFFFF;color:#34404F !important;border:2px solid #C9D6CF !important;border-radius:12px;clip-path:none}
html[data-theme="soft"] .part-section{background:#FBF8F1;border:1px solid #DDD5C4;border-left:6px solid #3F7A67;border-radius:14px;clip-path:none;box-shadow:0 2px 8px rgba(52,64,79,.06)}
html[data-theme="soft"] .part-header{border-bottom:1px solid #DDD5C4}
html[data-theme="soft"] .part-title{color:#2F5F50}
html[data-theme="soft"] .part-range{background:#E3EAF4;color:#3C5F8A;border-radius:999px;font-weight:700}
html[data-theme="soft"] .art-item{background:#FFFFFF;border:1px solid #E3DCCB;border-radius:12px;clip-path:none;box-shadow:0 1px 3px rgba(52,64,79,.06)}
html[data-theme="soft"] .art-item:hover{background:#F3F7F4;border-color:#B9CFC5}
html[data-theme="soft"] .art-item.expanded{background:#F6FAF7;border-color:#3F7A67;box-shadow:0 3px 12px rgba(63,122,103,.15)}
html[data-theme="soft"] .art-num{background:#3F7A67;color:#FFFFFF;border-radius:8px;clip-path:none;font-weight:800}
html[data-theme="soft"] .art-item.sub-art .art-num{background:#C98A3D}
html[data-theme="soft"] .art-item.repealed .art-num{background:#B5655F;color:#fff;text-decoration:line-through}
html[data-theme="soft"] .art-item.repealed .art-name{color:#8A6A68;text-decoration:line-through}
html[data-theme="soft"] .art-name{color:#2B3644;font-weight:700}
html[data-theme="soft"] .art-toggle-icon{color:#3C5F8A;border:1px solid #B8C9E0;background:#EEF3FA;border-radius:6px}
html[data-theme="soft"] .art-detail{color:#34404F;font-size:1.02rem;line-height:1.95;border-top:1px dashed #D3C9B4}
html[data-theme="soft"] .art-detail .art-intro{font-weight:600;color:#2B3644;background:#EEF5F1;border-radius:8px;padding:8px 12px}
html[data-theme="soft"] .art-detail ul.art-pts li{padding-left:26px}
html[data-theme="soft"] .art-detail ul.art-pts li::before{background:#3F7A67;border-radius:50%;transform:none;width:9px;height:9px;top:1em}
html[data-theme="soft"] .art-detail ul.art-pts li:nth-child(3n+2)::before{background:#4F78A8}
html[data-theme="soft"] .art-detail ul.art-pts li:nth-child(3n)::before{background:#C98A3D}
html[data-theme="soft"] .art-detail ul.art-pts ul.art-pts{border-left:2px solid #C9D6CF}
html[data-theme="soft"] .art-detail ul.art-pts ul.art-pts li::before{width:6px;height:6px;background:#8CA89B}

.theme-bar .tb-label{opacity:.55;font-weight:700;transition:opacity .2s}
.theme-bar .tb-label.on{opacity:1}
.theme-switch{position:relative;width:52px;height:28px;border-radius:999px;border:2px solid rgba(255,255,255,.4);background:#222;cursor:pointer;padding:0;transition:background .25s,border-color .25s}
.theme-switch .knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fcee0a;transition:transform .25s,background .25s;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.theme-switch[aria-checked="true"]{background:#CFE3D9;border-color:#3F7A67}
.theme-switch[aria-checked="true"] .knob{transform:translateX(24px);background:#3F7A67}
.theme-switch:focus-visible{outline:3px solid #4F78A8;outline-offset:2px}

/* ===== Classic: same soft shapes & reading style as Soft Study, dark colors kept ===== */
html:not([data-theme]) .top-title{text-shadow:none}
html:not([data-theme]) .sub-header{clip-path:none;border-radius:999px;padding:5px 14px}
html:not([data-theme]) .art-search{border-radius:12px;clip-path:none;font-size:1.02rem;background:#141412}
html:not([data-theme]) .part-filter{border-radius:12px;clip-path:none}
html:not([data-theme]) .part-section{border-radius:14px;clip-path:none;border-left-width:6px;box-shadow:0 2px 10px rgba(0,0,0,.25)}
html:not([data-theme]) .part-range{border-radius:999px;font-weight:700;padding-left:12px;padding-right:12px}
html:not([data-theme]) .art-item{border-radius:12px;clip-path:none;box-shadow:0 1px 4px rgba(0,0,0,.25)}
html:not([data-theme]) .art-item:hover{background:#22221f}
html:not([data-theme]) .art-item.expanded{background:#1f1f1c;border-color:#fcee0a;box-shadow:0 3px 14px rgba(252,238,10,.12)}
html:not([data-theme]) .art-num{border-radius:8px;clip-path:none}
html:not([data-theme]) .art-item.repealed .art-num{text-decoration:line-through}
html:not([data-theme]) .art-item.repealed .art-name{text-decoration:line-through;opacity:.7}
html:not([data-theme]) .art-toggle-icon{border-radius:6px}
html:not([data-theme]) .art-detail{font-size:1.02rem;line-height:1.95}
html:not([data-theme]) .art-detail .art-intro{font-weight:600;background:rgba(252,238,10,.08);border-radius:8px;padding:8px 12px}
html:not([data-theme]) .art-detail ul.art-pts li{padding-left:26px}
html:not([data-theme]) .art-detail ul.art-pts li::before{background:#fcee0a;border-radius:50%;transform:none;width:9px;height:9px;top:1em}
html:not([data-theme]) .art-detail ul.art-pts li:nth-child(3n+2)::before{background:#00f0ff}
html:not([data-theme]) .art-detail ul.art-pts li:nth-child(3n)::before{background:#ff6b9a}
html:not([data-theme]) .art-detail ul.art-pts ul.art-pts{border-left:2px solid rgba(0,240,255,.45)}
html:not([data-theme]) .art-detail ul.art-pts ul.art-pts li::before{width:6px;height:6px;background:#8a8a7c}
</style>
</head>

  var a = arr.slice();

    a[i] = a[j];

}

    +'<input type="text" id="artSearchInput" class="art-search" placeholder="অনুচ্ছেদ নম্বর, শিরোনাম বা বিষয়বস্তু খুঁজুন (যেমন: ৭, 26, 7A, রিট, জরুরি)..." value="'+artSearch.replace(/"/g,'&quot;')+'">'
    +'<select id="artPartSelect" class="part-filter">'
    +'<option value="ALL"'+(artPart==="ALL"?' selected':'')+'>সকল ভাগ (১ম — ১১শ ভাগ)</option>';

  PARTS_ARTICLES.forEach(function(p, idx){
    h+='<option value="'+idx+'"'+(artPart===String(idx)?' selected':'')+'>'+p.part+'</option>';
  });
  h+='</select>'
    +'<button class="cyber-btn cyan" id="toggleAllDetailsBtn" style="padding:10px 16px;">'+(artShowAll ? 'বিস্তারিত সংকুচিত করুন [-]' : 'সকল বিস্তারিত দেখুন [+]')+'</button>'
    +'</div><div id="artResults"></div>';
  $app.innerHTML=h;

  renderArticleList();

  var inp = document.getElementById("artSearchInput");
  var sel = document.getElementById("artPartSelect");
  var tgl = document.getElementById("toggleAllDetailsBtn");
  if(inp){
    inp.addEventListener("input", function(e){
      artSearch = e.target.value;
      renderArticleList();
    });
  }
  if(sel){
    sel.addEventListener("change", function(e){
      artPart = e.target.value;
      renderArticleList();
    });
  }
  if(tgl){
    tgl.addEventListener("click", function(){
      artShowAll = !artShowAll;
      tgl.textContent = artShowAll ? 'বিস্তারিত সংকুচিত করুন [-]' : 'সকল বিস্তারিত দেখুন [+]';
      renderArticleList();
    });
  }
}


function ptsText(item){
  var out=[];
  (function walk(a){(a||[]).forEach(function(x){
    if(typeof x==="string") out.push(x);
    else if(Array.isArray(x)){ if(typeof x[0]==="string") out.push(x[0]); walk(x[1]); }
  })})(item.pts);
  return out.join(" ");
}
function listHtml(arr){
  var h='<ul class="art-pts">';
  arr.forEach(function(x){
    if(typeof x==="string") h+='<li>'+x+'</li>';
    else if(x[1] && x[1].length) h+='<li>'+x[0]+listHtml(x[1])+'</li>';
    else h+='<li>'+x[0]+'</li>';
  });
  return h+'</ul>';
}
function detailHtml(item){
  var h='';
  if(item.d) h+='<p class="art-intro">'+item.d+'</p>';
  if(item.pts && item.pts.length) h+=listHtml(item.pts);
  return h;
}
function renderArticleList(){
  var box = document.getElementById("artResults");
  if(!box) return;
  var q = artSearch.trim().toLowerCase();
  // Accept English digits: 26 -> ২৬, 7a/7A -> ৭ক, 141b -> ১৪১খ
  var bnD = "০১২৩৪৫৬৭৮৯", sfx = {a:"ক", b:"খ", c:"গ"};
  var numMatch = q.replace(/[\s.\-]/g,"").match(/^([0-9০-৯]+)([a-cক-গ]?)$/);
  var qNum = null;
  if(numMatch){
    var digits = numMatch[1].replace(/[0-9]/g,function(d){return bnD[+d]});
    qNum = digits + (sfx[numMatch[2]] || numMatch[2]);
  }
  var html = "";
  var foundAny = false;

  PARTS_ARTICLES.forEach(function(p, idx){
    if(artPart !== "ALL" && artPart !== String(idx)) return;
    var filtered = p.items.filter(function(item){
      if(!q) return true;
      if(qNum !== null){
        // number search: match the article number only (e.g. 7 -> ৭, ৭ক, ৭খ; not ১৭)
        if(numMatch[2]) return item.n === qNum;
        return item.n === qNum || (item.n.indexOf(qNum) === 0 && !/[০-৯]/.test(item.n.charAt(qNum.length)));
      }
      return item.n.toLowerCase().indexOf(q) !== -1 ||
             item.t.toLowerCase().indexOf(q) !== -1 ||
             ((item.d||'').toLowerCase().indexOf(q) !== -1) ||
             (ptsText(item).toLowerCase().indexOf(q) !== -1) ||
             p.part.toLowerCase().indexOf(q) !== -1;
    });
    if(!filtered.length) return;
    foundAny = true;

    html += '<div class="part-section">'
          + '<div class="part-header">'
          + '<div class="part-title">'+p.part+'</div>'
          + '<div class="part-range">'+p.range+' ('+filtered.length+'টি অনুচ্ছেদ)</div>'
          + '</div>'
          + '<div class="art-list'+(artShowAll || q.length > 0 ? ' show-all' : '')+'">';

    filtered.forEach(function(item){
      var cls = "art-item" + (item.sub ? " sub-art" : "") + (item.rep ? " repealed" : "");
      html += '<div class="'+cls+'" onclick="this.classList.toggle(\'expanded\')">'
            + '<div class="art-row-top">'
            + '<div class="art-title-wrap">'
            + '<span class="art-num">'+item.n+'</span>'
            + '<span class="art-name">'+item.t+'</span>'
            + '</div>'
            + '<span class="art-toggle-icon">INFO</span>'
            + '</div>'
            + '<div class="art-detail">'+detailHtml(item)+'</div>'
            + '</div>';
    });

    html += '</div></div>';
  });

  if(!foundAny){
    html = '<div class="cyber-box"><h2>// NO MATCH FOUND</h2><p style="color:var(--cp-muted);">আপনার অনুসন্ধানের সাথে কোনো অনুচ্ছেদ মেলেনি। অন্য শব্দ বা নম্বর দিয়ে চেষ্টা করুন।</p></div>';
  }
  box.innerHTML = html;
}

function cards(){
  var gCards = W(gid);
  if(!built){
    var unk=gCards.filter(function(c){return !S.known[c.id]}).map(function(c){return c.id});
    queue=unk.length?unk:gCards.map(function(c){return c.id});
    built=true;fl=false;
  }
  var tot=gCards.length,k=kn(gid),$b=document.getElementById("body");
  var pct=Math.round((k/tot)*100);
  var bar='<div class="stat-bar"><span>MODULE_PROGRESS: '+k+' / '+tot+' MASTERED ('+pct+'%)</span><button data-a="rst" style="color:var(--cp-red);text-transform:uppercase;text-decoration:underline;min-height:36px;">[RESET PROGRESS]</button></div><div class="bar-container"><i style="width:'+pct+'%"></i></div>';
  
  if(!queue.length){
    $b.innerHTML=bar+'<div class="cyber-box"><h2>// MODULE SYNCHRONIZED</h2><p style="color:var(--cp-muted);margin-bottom:20px;font-size:1.1rem;">অভিনন্দন! এই মডিউলের সবগুলো কার্ড সফলভাবে আয়ত্ত হয়েছে।</p><div class="act"><button class="cyber-btn outline" data-a="again">RE-STUDY ALL CARDS</button><button class="cyber-btn" data-a="m-test">START DIAGNOSTIC TEST &gt;</button></div></div>';
    return;
  }
  
  var currentCard = CARDS.find(function(c){return c.id===queue[0]});
  $b.innerHTML=bar+'<div class="scene" id="cardScene" data-a="flip"><div class="card'+(fl?" fl":"")+'"><div class="face front"><div class="card-badge">'+currentCard.num+'</div><div class="term-bn">'+currentCard.q+'</div><div class="hint">[ TAP OR SPACE TO DECRYPT ANSWER ]</div></div><div class="face back-f"><div class="back-header"><span class="chip yellow">'+currentCard.num+'</span><span class="chip cyan">'+currentCard.tag+'</span></div><div class="ans-body">'+currentCard.aHtml+'</div><div class="row-note"><small>INFO:</small> '+currentCard.note+'</div></div></div></div><div class="act"><button class="cyber-btn red" data-a="no">&#10006; আবার পড়ুন (QUEUE: '+queue.length+')</button><button class="cyber-btn" data-a="yes">&#10004; আয়ত্ত হয়েছে (MARK KNOWN)</button></div><div class="kbd-hints"><span><span class="kbd">SPACE</span> FLIP</span><span><span class="kbd">&larr;</span> REVIEW</span><span><span class="kbd">&rarr;</span> KNOWN</span></div>';
  bindTouchEvents();
}

function test(){
  var gCards=W(gid),$b=document.getElementById("body"),b=S.best[gid];
  if(!T){
    var maxQ = gCards.length;
    var opts = "";
    if(maxQ >= 4) opts += '<option value="4">৪টি প্রশ্ন (কুইক স্ক্যান)</option>';
    if(maxQ >= 8) opts += '<option value="8">৮টি প্রশ্ন (স্ট্যান্ডার্ড)</option>';
    opts += '<option value="'+maxQ+'" selected>সবগুলো ('+maxQ+'টি প্রশ্ন)</option>';
    $b.innerHTML='<div class="cyber-box"><h2>// CONSTITUTIONAL DIAGNOSTIC</h2><p style="color:var(--cp-muted);font-size:1.05rem;">নির্বাচিত মডিউলের ওপর এমসিকিউ (MCQ) পরীক্ষা শুরু করুন'+(b!==undefined?' // সর্বোচ্চ স্কোর: '+b+'%':'')+'</p><select id="len" aria-label="Number of questions">'+opts+'</select><br><button class="cyber-btn" data-a="go">EXECUTE TEST &gt;</button></div>';
    return;
  }
  if(T.i>=T.qs.length){
    var sc=T.qs.length-T.miss.length,p=Math.round(sc/T.qs.length*100);
    if(S.best[gid]===undefined||p>S.best[gid]){S.best[gid]=p;save()}
    var h='<div class="cyber-box"><h2>// DIAGNOSTIC COMPLETE: '+p+'%</h2><p style="color:var(--cp-cyan);font-family:var(--font-mono);margin-bottom:14px;">ACCURACY: '+sc+' / '+T.qs.length+' VERIFIED</p>';
    if(T.miss.length){
      h+='<h3 style="text-align:left;color:var(--cp-red);font-family:var(--font-mono);font-size:0.9rem;border-bottom:1px solid var(--cp-red);padding-bottom:6px;">[ যে প্রশ্নগুলো ভুল হয়েছে তা পর্যালোচনা করুন ]</h3><ul class="miss">';
      T.miss.forEach(function(m){
        h+='<li><b>'+m.num+': '+m.q+'</b><br><span style="color:var(--cp-cyan);">সঠিক উত্তর:</span> '+m.shortA+'</li>';
      });
      h+='</ul>';
    } else {
      h+='<p style="color:var(--cp-green);font-weight:bold;margin:18px 0;font-size:1.15rem;">&#10004; ১০০% নির্ভুল উত্তর! আপনার প্রস্তুতি চমৎকার।</p>';
    }
    $b.innerHTML=h+'<div class="act"><button class="cyber-btn outline" data-a="retest">RE-RUN DIAGNOSTIC</button><button class="cyber-btn" data-a="m-cards">RETURN TO CARDS</button></div></div>';
    return;
  }
  var q=T.qs[T.i],pct=Math.round(T.i/T.qs.length*100);
  var h='<div class="stat-bar"><span>QUERY '+(T.i+1)+' OF '+T.qs.length+'</span><span>'+pct+'% COMPLETED</span></div><div class="bar-container"><i style="width:'+pct+'%"></i></div><div class="cyber-box" style="text-align:left"><div class="q">// '+q.card.num+' ('+q.card.tag+')</div><div class="qw">'+q.card.q+'</div>';
  q.o.forEach(function(o,idx){
    var cls="opt";
    if(T.pick!==null){
      if(o===q.ok)cls+=" good";
      else if(idx===T.pick)cls+=" bad";
    }
    h+='<button class="'+cls+'" data-o="'+idx+'"'+(T.pick!==null?' disabled':'')+'>'+o+'</button>';
  });
  if(T.pick!==null)h+='<div style="margin-top:16px;text-align:right"><button class="cyber-btn" data-a="next">'+(T.i+1===T.qs.length?"VIEW RESULTS":"NEXT QUERY")+' &gt;</button></div>';
  $b.innerHTML=h+'</div>';
}

function mkTest(n){
  var pool=shuf(W(gid)).slice(0,n);
  var qs=pool.map(function(card){
    var distractors=shuf(CARDS.filter(function(c){return c.id!==card.id})).slice(0,3).map(function(c){return c.shortA});
    return {
      card: card,
      ok: card.shortA,
      o: shuf([card.shortA].concat(distractors))
    };
  });
  return {qs:qs,i:0,pick:null,miss:[]};
}

// Touch Swipe Gestures
function bindTouchEvents(){
  var scene=document.getElementById("cardScene");
  if(!scene)return;
  var startX=0,startY=0;
  scene.addEventListener("touchstart",function(e){
    startX=e.changedTouches[0].screenX;
    startY=e.changedTouches[0].screenY;
  },{passive:true});
  scene.addEventListener("touchend",function(e){
    var dx=e.changedTouches[0].screenX-startX;
    var dy=e.changedTouches[0].screenY-startY;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)){
      if(dx<0 && queue.length){
        var c=queue.shift();queue.push(c);fl=false;cards();
      } else if(dx>0 && queue.length){
        S.known[queue[0]]=1;save();queue.shift();fl=false;cards();
      }
    }
  },{passive:true});
}

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-g],[data-a],[data-o]");if(!el)return;
  if(navLinks && navLinks.classList.contains("open") && el.closest("#navLinks")){
    navLinks.classList.remove("open");
  }
  if(el.dataset.g!==undefined){gid=+el.dataset.g;view="group";mode="cards";built=false;T=null;return render()}
  var a=el.dataset.a;
  if(a==="home"){view="articles";T=null;return render()}
  if(a==="articles"){view="articles";T=null;return render()}
  if(a==="all-cards"){gid=0;view="group";mode="cards";built=false;T=null;return render()}
  if(a==="m-cards"){if(view!=="group"){gid=0;view="group";}mode="cards";built=false;T=null;return render()}
  if(a==="m-test"){if(view!=="group"){gid=0;view="group";}mode="test";T=null;return render()}
  if(a==="flip"){fl=!fl;var c=document.querySelector(".card");if(c)c.classList.toggle("fl",fl);return}
  if(a==="yes"){if(!queue.length)return;S.known[queue[0]]=1;save();queue.shift();fl=false;return cards()}
  if(a==="no"){if(!queue.length)return;var c=queue.shift();queue.push(c);fl=false;return cards()}
  if(a==="again"){queue=W(gid).map(function(c){return c.id});fl=false;return cards()}
  if(a==="rst"){W(gid).forEach(function(c){delete S.known[c.id]});save();built=false;return cards()}
  if(a==="go"){var lenEl=document.getElementById("len");T=mkTest(lenEl?+lenEl.value:W(gid).length);return test()}
  if(a==="retest"){T=null;return test()}
  if(a==="next"){T.i++;T.pick=null;return test()}
  if(el.dataset.o!==undefined&&T&&T.pick===null){T.pick=+el.dataset.o;var q=T.qs[T.i];if(q.o[T.pick]!==q.ok)T.miss.push(q.card);return test()}
});

document.addEventListener("keydown",function(e){
  if(e.target && (e.target.tagName==="INPUT" || e.target.tagName==="SELECT"))return;
  if(view!=="group"||mode!=="cards")return;
  if(e.code==="Space"){e.preventDefault();fl=!fl;var c=document.querySelector(".card");if(c)c.classList.toggle("fl",fl)}
  else if(e.code==="ArrowRight"&&queue.length){S.known[queue[0]]=1;save();queue.shift();fl=false;cards()}
  else if(e.code==="ArrowLeft"&&queue.length){var c=queue.shift();queue.push(c);fl=false;cards()}
});

view="articles";load();view="articles";render();
})();

// Theme switcher (default: Soft Study)
(function(){
  var root=document.documentElement,sw=document.getElementById("themeSwitch"),
      labels=document.querySelectorAll("#themeBar .tb-label");
  function apply(t){
    if(t==="classic")root.removeAttribute("data-theme");else root.setAttribute("data-theme","soft");
    sw.setAttribute("aria-checked",String(t!=="classic"));
    labels.forEach(function(l){l.classList.toggle("on",(l.dataset.side==="soft")===(t!=="classic"))});
  }
  var saved="soft";
  try{saved=localStorage.getItem("bd-const-theme-v2")||"soft"}catch(e){}
  apply(saved==="classic"?"classic":"soft");
  sw.addEventListener("click",function(){
    var next=sw.getAttribute("aria-checked")==="true"?"classic":"soft";
    apply(next);
    try{localStorage.setItem("bd-const-theme-v2",next)}catch(e){}
  });
  labels.forEach(function(l){l.style.cursor="pointer";l.addEventListener("click",function(){
    var t=l.dataset.side;apply(t);try{localStorage.setItem("bd-const-theme-v2",t)}catch(e){}
  })});
})();
</script>
